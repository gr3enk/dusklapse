name: Backend Test

# Both triggers on purpose: the pull_request run is the gate, and the push run keeps main's own
# history of green and red so a bad merge is attributable to a commit.
#
# The path lists are written out twice rather than shared through a YAML anchor. Anchors are not
# dependably supported by the workflow parser, and a workflow that silently fails to load is worse
# than a few duplicated lines.
on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/backend-test.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/backend-test.yml"

# A second push to the same branch makes the first run pointless, so it is cancelled. Not on main,
# where each commit's result is worth keeping.
concurrency:
  group: backend-test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri links against the system WebView even to build a test binary, so these are needed to
      # compile at all, not only to bundle. On macOS they come with the OS, which is why this step
      # exists only for the Linux runner.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      # `shared-key` on purpose: this and the sibling backend workflow compile almost the same
      # dependency graph, and without it each would keep its own copy of a cold build. Pointed at
      # the crate rather than the repository root - there is no workspace here, the manifest lives
      # in src-tauri.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: backend

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test
