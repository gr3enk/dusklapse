name: Backend Test

# Pull requests only. A merge to main replays the same commits the pull request already
# checked, so a push trigger runs every check a second time on code that has not changed.
#
# The trade-off: a commit pushed straight to main is never checked. Branch protection is what
# closes that - require these checks and main can only be reached through a pull request.
on:
    pull_request:
        paths:
            - "src-tauri/**"
            - ".github/workflows/backend-test.yml"

# A second push to the same pull request makes the first run pointless, so it is cancelled.
concurrency:
    group: backend-test-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            # Tauri links against the system WebView even to build a test binary, so these are needed to
            # compile at all, not only to bundle. On macOS they come with the OS, which is why this step
            # exists only for the Linux runner.
            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y \
                    libwebkit2gtk-4.1-dev \
                    libgtk-3-dev \
                    librsvg2-dev \
                    patchelf

            - uses: dtolnay/rust-toolchain@stable

            # `shared-key` on purpose: this and the sibling backend workflow compile almost the same
            # dependency graph, and without it each would keep its own copy of a cold build. Pointed at
            # the crate rather than the repository root - there is no workspace here, the manifest lives
            # in src-tauri.
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri
                  shared-key: backend

            - name: Unit tests
              working-directory: src-tauri
              run: cargo test
