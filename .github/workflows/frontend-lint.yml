name: Frontend Lint

# Pull requests only. A merge to main replays the same commits the pull request already
# checked, so a push trigger runs every check a second time on code that has not changed.
#
# The trade-off: a commit pushed straight to main is never checked. Branch protection is what
# closes that - require these checks and main can only be reached through a pull request.
on:
    pull_request:
        paths:
            - "src/**"
            - "index.html"
            - "package.json"
            - "pnpm-lock.yaml"
            - "tsconfig*.json"
            - "vite.config.ts"
            - "eslint.config.js"
            - ".github/workflows/frontend-lint.yml"

# A second push to the same pull request makes the first run pointless, so it is cancelled.
concurrency:
    group: frontend-lint-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            # Before setup-node, which needs pnpm to exist in order to cache its store. Reads the version
            # from the `packageManager` field, so CI runs the same pnpm as a developer machine.
            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            # `--frozen-lockfile` fails rather than resolving anew, so a package.json changed without its
            # lockfile is caught here instead of drifting.
            - run: pnpm install --frozen-lockfile

            # Named separately so a red check says which of the two failed without opening the log.
            - name: ESLint
              run: pnpm lint

            # Here rather than in the test workflow: it is a static check on code that never runs, which
            # is what the rest of this workflow is.
            - name: Typecheck
              run: pnpm typecheck
