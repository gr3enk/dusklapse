name: Backend

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri links against the system WebView even to build a test binary, so these are needed to
      # compile at all, not only to bundle. On macOS they come with the OS, which is why this step
      # exists only for the Linux runner.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Pointed at the crate rather than the repository root: there is no workspace here, the
      # manifest lives in src-tauri.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `--all-targets` so the tests are linted too. They are where most of this crate's tricky
      # arithmetic is written down, and a lint finding there is as real as anywhere else.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test
