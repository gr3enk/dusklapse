name: Release

# Manual on purpose. A release is a decision, and the one thing this workflow cannot decide is
# whether the code is ready. What it removes is the mechanical part: the build number that has to
# rise, the export method that has to be right, and the upload.
#
# What happens to the build afterwards - TestFlight group, submission for review - stays in App
# Store Connect, which is where that choice belongs.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Marketing version to raise (the build number always rises on its own)"
        type: choice
        default: patch
        options: [patch, minor, major, none]

# Never cancel a release in flight: an upload interrupted halfway leaves a build in App Store
# Connect in a state nobody asked for. One at a time, queued.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # To push the version bump and its tag.
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, so a bump can see what already exists.
          fetch-depth: 0

      # The generated Xcode project must keep the patch that stops `libapp.a` being copied into the
      # bundle. Without it the build succeeds, the upload succeeds, and App Store validation
      # rejects it - a 398 MB static library inside the .app. `tauri ios init` overwrites
      # project.yml, so this is checked rather than assumed.
      - name: Check the Xcode project patch is intact
        run: |
          if ! grep -q "buildPhase: none" src-tauri/gen/apple/project.yml; then
            echo "::error file=src-tauri/gen/apple/project.yml::The 'Externals' source entry has lost 'buildPhase: none'. libapp.a would be bundled and App Store validation would reject the build. Re-add it and run 'xcodegen generate' in src-tauri/gen/apple."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      # Its own cache key: this is a release-profile build for a different target than the CI
      # checks, so sharing with them would only evict what both need.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release

      # Before the build, so what is built is what was committed. If the build then fails, re-run
      # with bump=none rather than raising the version twice.
      - name: Raise the marketing version
        if: inputs.bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(node scripts/bump-version.mjs "${{ inputs.bump }}")
          git commit -am "Release v$VERSION"
          git tag "v$VERSION"
          git push --follow-tags

      - name: Read the version
        id: version
        run: echo "value=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      # altool looks for a file named AuthKey_<key id>.p8 in this directory.
      - name: Place the App Store Connect key
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$KEY" | base64 --decode > ~/"private_keys/AuthKey_$KEY_ID.p8"

      # Removed rather than overwritten. Earlier builds left a stale Payload/ beside the fresh
      # output and it was installed for two rounds before anyone noticed the version never changed.
      - name: Clear previous output
        run: rm -rf src-tauri/gen/apple/build

      # `bundleVersion` and not `--build-number`: the flag appends to the marketing version and
      # produces a four-component CFBundleVersion like 0.1.0.7, which is outside Apple's stated
      # three. This sets CFBundleVersion to the run number alone, which is a single integer that
      # only ever rises - exactly what an upload has to have.
      #
      # The certificate and profile are read by the Tauri CLI itself from these variables, so no
      # temporary keychain has to be built by hand here.
      - name: Build
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          pnpm tauri ios build \
            --ci \
            --export-method app-store-connect \
            -c '{"bundle":{"iOS":{"bundleVersion":"${{ github.run_number }}"}}}'

      # Globbed and counted rather than hardcoded: the output path has already moved once between
      # CLI versions, and a wrong path here would upload nothing while reporting success.
      - name: Locate the package
        id: ipa
        run: |
          FOUND=$(find src-tauri/gen/apple/build -name "*.ipa" -type f)
          COUNT=$(printf '%s\n' "$FOUND" | grep -c . || true)
          if [ "$COUNT" != "1" ]; then
            echo "::error::Expected exactly one .ipa, found $COUNT:"; printf '%s\n' "$FOUND"
            exit 1
          fi
          echo "path=$FOUND" >> "$GITHUB_OUTPUT"

      # Kept whatever happens next, so a failed upload does not mean a lost build.
      - uses: actions/upload-artifact@v4
        with:
          name: Dusklapse-${{ steps.version.outputs.value }}-${{ github.run_number }}
          path: ${{ steps.ipa.outputs.path }}

      # Validation first. It is the same check the Xcode Organizer runs, and it is what catches a
      # malformed bundle in a minute instead of after an upload and a rejection mail.
      - name: Validate
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: xcrun altool --validate-app -f "${{ steps.ipa.outputs.path }}" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"

      - name: Upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: xcrun altool --upload-app -f "${{ steps.ipa.outputs.path }}" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"

      # After the upload, so the existence of a release means the build actually reached App Store
      # Connect. On bump=none there is no tag to hang one on, hence the condition.
      #
      # `--generate-notes` writes the changelog since the previous tag; `--notes` is prepended to
      # it. The build number goes there because it is the one thing the git history cannot tell you
      # later - which TestFlight build belongs to which commit, which is exactly what you need when
      # a crash report turns up in three months.
      #
      # No assets. The .ipa is signed for App Store distribution and will not install on any device
      # outside TestFlight, so offering it as a download would promise something it cannot do. It
      # stays a build artifact of this run instead.
      - name: GitHub release
        if: inputs.bump != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.value }}" \
            --verify-tag \
            --title "v${{ steps.version.outputs.value }}" \
            --generate-notes \
            --notes 'TestFlight build `${{ github.run_number }}`.'

      - name: Summary
        run: |
          {
            echo "### Uploaded"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ steps.version.outputs.value }}\` |"
            echo "| Build | \`${{ github.run_number }}\` |"
            echo
            echo "Processing takes 10-30 minutes. The build then appears under TestFlight, where you choose what happens to it."
          } >> "$GITHUB_STEP_SUMMARY"
