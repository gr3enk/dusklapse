name: dusklapse
options:
  bundleIdPrefix: dev.greenk.dusklapse
  deploymentTarget:
    iOS: 16.4
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Dusklapse
      PRODUCT_BUNDLE_IDENTIFIER: dev.greenk.dusklapse
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  dusklapse_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # `buildPhase: none` keeps the folder visible in the project without putting it in any build
      # phase. Left as a plain source, Xcode cannot compile a static library so it copies it as a
      # resource instead - a 398 MB `libapp.a` inside the .app, which App Store validation rejects
      # outright ("standalone executables or libraries are not permitted").
      #
      # The linking is unaffected: that comes from the `libapp.a` entry under `dependencies` plus
      # the LIBRARY_SEARCH_PATHS below, not from build-phase membership.
      - path: Externals
        buildPhase: none
      - path: dusklapse_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: dusklapse_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
    entitlements:
      path: dusklapse_iOS/dusklapse_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        # Stated here rather than left to the CLI, which writes it into project.pbxproj on every
        # build from `bundle.iOS.developmentTeam`. That works right up to the next
        # `xcodegen generate`, which rebuilds the pbxproj from this file and drops it - and without
        # a team, automatic signing cannot resolve a profile, so even a debug build fails with
        # "requires a provisioning profile".
        DEVELOPMENT_TEAM: VB4YTUPT3S
      # Release only, so `tauri ios dev` keeps the automatic signing that works well against a
      # connected device. A release build is the only one that has to be signed for distribution.
      #
      # Why this is here rather than left to the CLI: with a certificate in the environment, Tauri
      # switches CODE_SIGN_STYLE to Manual - but it only sets the profile when it managed to read a
      # UUID out of IOS_MOBILE_PROVISION, and that failure is swallowed by an `.ok()`. The result is
      # a half-configured project: manual signing with no profile, and xcodebuild failing with
      # "requires a provisioning profile" and no mention of the actual cause.
      #
      # Named rather than given as a UUID: a regenerated profile keeps its name and loses its UUID.
      # The export step picks the same setting up as its fallback, so this covers both halves.
      configs:
        # Spelled out rather than left to the absence of a key: with `configs` present, the
        # inherited default is not obvious, and a debug build that silently expects a distribution
        # profile fails in a way that reads like a signing problem on the device.
        debug:
          CODE_SIGN_STYLE: Automatic
        release:
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: GH Release Action
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: pnpm tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a